<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMRP Hareket Haritası</title><link rel="stylesheet" href="/movement-map.css"></head>
<body><header><div><small>AMRP STRATEJİ MASASI</small><h1>Görsel Hareket Haritası</h1></div><div class="head-meta"><span id="turn">Tur —</span><span id="identity">Bağlanıyor…</span><button id="refresh">Yenile</button></div></header>
<main><aside class="left"><section><h2>Birlik Objeleri</h2><p class="muted">Bu ekran yalnızca görsel planlama içindir. Oyun orduları ve belgeler değişmez.</p><div class="filters"><button class="active" data-kind="ALL">Tümü</button><button data-kind="ARMY">Ordular</button><button data-kind="FLEET">Filolar</button></div><div id="forces" class="list"></div></section></aside>
<section class="map-shell"><div class="toolbar"><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="fit">Haritaya sığdır</button><span id="hint">Bir birlik seçin.</span></div><canvas id="map"></canvas><div id="routeCard" class="route-card hidden"><strong>Planlanan rota</strong><span id="routeSummary"></span><label>Açıklama <input id="purpose" maxlength="160" placeholder="Örn. Roma yönüne ilerle"></label><div><button id="clearRoute">Temizle</button><button id="confirmRoute" class="primary">Rotayı onayla</button><button id="directMove" class="danger hidden">GM: Doğrudan yerleştir</button></div></div><div id="toast" class="toast hidden"></div></section>
<aside class="right"><section><h2>Hareket Emirleri</h2><p class="muted" id="orderHelp">Onaylanan rotalar burada görünür.</p><div id="orders" class="list"></div></section><section><h2>Harita Özeti</h2><div id="stats" class="stats"></div></section></aside></main>
<script type="module" src="/movement-map.js"></script></body></html>
